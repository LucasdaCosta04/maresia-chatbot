name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar o Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Rodar os testes
        run: |
          if [ -d testes ]; then
            python -m pytest -q
          else
            echo "A pasta testes/ ainda não existe neste repositório."
          fi
