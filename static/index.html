<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Maresia, a assistente virtual do restaurante Tempero Açoriano.">
  <title>Maresia | Tempero Açoriano</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700&family=Alegreya+Sans:wght@400;500;700&display=swap">

  <link rel="stylesheet" href="/static/styles.css">

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%231E4F91'/%3E%3Cpath d='M20 5 35 20 20 35 5 20Z' fill='%23F3F5F4'/%3E%3Ccircle cx='20' cy='20' r='6' fill='%23C8861A'/%3E%3C/svg%3E">
</head>
<body>
  <!-- Símbolos reutilizáveis (usados com <use href="#azulejo">) -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
    <symbol id="azulejo" viewBox="0 0 40 40">
      <rect width="40" height="40" fill="#F3F5F4"/>
      <path d="M0 0h10L0 10Z M40 0v10L30 0Z M0 40V30l10 10Z M40 40H30l10-10Z" fill="#1E4F91"/>
      <path d="M20 4 36 20 20 36 4 20Z" fill="none" stroke="#1E4F91" stroke-width="2"/>
      <path d="M20 10c3 4 6 7 10 10-4 3-7 6-10 10-3-4-6-7-10-10 4-3 7-6 10-10Z" fill="#1E4F91"/>
      <circle cx="20" cy="20" r="3.5" fill="#C8861A"/>
      <circle cx="20" cy="4" r="1.5" fill="#C8861A"/>
      <circle cx="36" cy="20" r="1.5" fill="#C8861A"/>
      <circle cx="20" cy="36" r="1.5" fill="#C8861A"/>
      <circle cx="4" cy="20" r="1.5" fill="#C8861A"/>
    </symbol>
  </svg>

  <header class="topo">
    <div class="topo__marca">
      <svg class="topo__logo" width="44" height="44" aria-hidden="true" focusable="false">
        <use href="#azulejo"/>
      </svg>
      <div class="topo__textos">
        <p class="topo__restaurante">Tempero Açoriano</p>
        <h1 class="topo__titulo">Maresia, assistente virtual</h1>
        <p id="status" class="topo__status" role="status" aria-live="polite">Conectando…</p>
      </div>
    </div>

    <div class="topo__acoes">
      <button id="botao-reiniciar" class="botao botao--secundario" type="button"
              title="Começar uma nova conversa">
        Reiniciar
      </button>
      <button id="botao-painel" class="botao botao--secundario" type="button"
              aria-controls="painel" aria-expanded="false"
              title="Ver detalhes do modelo">
        Painel
      </button>
    </div>
  </header>

  <div class="faixa-azulejos" aria-hidden="true"></div>

  <main class="layout">
    <section class="conversa" aria-label="Conversa com a Maresia">
      <ol id="mensagens" class="mensagens" aria-live="polite" aria-relevant="additions"></ol>

      <div id="sugestoes" class="sugestoes" aria-label="Sugestões de mensagem"></div>

      <form id="formulario" class="formulario" autocomplete="off">
        <label for="campo-mensagem" class="visualmente-oculto">Digite sua mensagem</label>
        <input id="campo-mensagem" class="formulario__campo" type="text" name="mensagem"
               placeholder="Pergunte sobre cardápio, horários, reservas…"
               maxlength="500" required>
        <button id="botao-enviar" class="botao botao--primario" type="submit">Enviar</button>
      </form>

      <footer class="rodape">
        <p>Projeto desenvolvido por Carlos, Lucas e Murilo.</p>
      </footer>
    </section>

    <!-- continua: painel lateral (#painel), script e fechamento de </main>, </body> e </html> -->
